version: "3.8"

services:
  chatbot-deploy-api:
    build: .
    container_name: chatbot-deploy-api
    ports:
      - "8101:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  chatbot-deploy-dashboard:
    image: nginx:alpine
    container_name: chatbot-deploy-dashboard
    ports:
      - "8102:80"
    volumes:
      - ./src/dashboard/public:/usr/share/nginx/html
    restart: unless-stopped
